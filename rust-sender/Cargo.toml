[package]
name = "porter-sender"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
crossterm = "0.29.0"
futures-util = "0.3.33"
multer = "3.1.0"
qrcode = "0.14.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "io-util", "sync"] }
