name: porter_receiver
description: Porter offline file transfer receiver for Android and macOS.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera & QR scanning
  mobile_scanner: ^7.0.0

  # State management
  provider: ^6.0.0

  # File handling
  path_provider: ^2.1.0
  file_picker: ^11.0.0
  url_launcher: ^6.2.0

  # Data processing
  archive: ^4.0.9
  convert: ^3.1.1
  crypto: ^3.0.7

  # Persisted settings
  shared_preferences: ^2.5.5

  # Relay to porter serve
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Local fork: adds macOS external-camera enumeration/selection
  # (see third_party/mobile_scanner).
  mobile_scanner:
    path: third_party/mobile_scanner

flutter:
  uses-material-design: true
