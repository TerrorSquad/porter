name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch release.yml

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN, no PAT — nothing to expire. A release it publishes does
      # not trigger other workflows (GitHub's anti-recursion rule), so the
      # step below starts release.yml explicitly rather than relying on the
      # `release: published` event.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}

      - name: Cut the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" --field tag="$TAG"
