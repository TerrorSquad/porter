name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT, not GITHUB_TOKEN: a release published by GITHUB_TOKEN does
          # not trigger other workflows (GitHub's anti-recursion rule), so
          # release.yml would never fire and every release would need a manual
          # dispatch. Falls back to github.token, which still cuts the release
          # PR and tag — only the downstream build has to be started by hand.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
