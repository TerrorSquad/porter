name: release

# release-please cuts the tag; this builds the sender for each platform,
# attaches the tarballs to the release, and points the Homebrew tap at them.
on:
  release:
    types: [published]
  # Lets a failed or re-run release be rebuilt without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v2.9.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-sender
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package the binary
        id: package
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          NAME="porter-sender_${VERSION}_${{ matrix.target }}.tar.gz"
          tar -czf "$NAME" -C "target/${{ matrix.target }}/release" porter-sender
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Homebrew verifies this; the formula job reads it back from here.
          shasum -a 256 "$NAME" | cut -d" " -f1 > "$NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            rust-sender/${{ steps.package.outputs.name }}
            rust-sender/${{ steps.package.outputs.name }}.sha256

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.package.outputs.name }}" --clobber

  formula:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write the formula
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/TerrorSquad/porter/releases/download/${TAG}"

          sha() { cat "dist/$1/porter-sender_${VERSION}_$1.tar.gz.sha256"; }

          cat > porter-sender.rb <<EOF
          # Generated by .github/workflows/release.yml. DO NOT EDIT.
          class PorterSender < Formula
            desc "Air-gapped file transfer: sends a file as a QR slideshow in your terminal"
            homepage "https://porter.goranninkovic.com"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/porter-sender_${VERSION}_aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              if Hardware::CPU.intel?
                url "${BASE}/porter-sender_${VERSION}_x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "${BASE}/porter-sender_${VERSION}_aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "${BASE}/porter-sender_${VERSION}_x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "porter-sender"
            end

            test do
              # The sender itself is a TUI and needs a real terminal, so the
              # smoke test drives \`join\`, which is plain file I/O. It takes
              # the transfer *directory* — the base name comes from that.
              (testpath/"demo").mkpath
              (testpath/"demo/demo.partaa").write "hello "
              (testpath/"demo/demo.partab").write "world"
              system "#{bin}/porter-sender", "join", "demo", "--output", "out.txt"
              assert_equal "hello world", (testpath/"out.txt").read
            end
          end
          EOF

      - name: Push it to the tap
        env:
          # Same secret forge's goreleaser uses — a PAT with write access to
          # homebrew-tap. GITHUB_TOKEN cannot reach another repository.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          gh repo clone TerrorSquad/homebrew-tap tap -- --depth=1
          cp porter-sender.rb tap/Formula/porter-sender.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/porter-sender.rb
          git diff --staged --quiet || git commit -m "porter-sender ${TAG}"
          git push
