# Migrated from .git-hooks.config.json
# Review and adjust as needed.
#
# The JS toolchain lives in nodejs/ (deprecated package, see ADR-0004), so
# every node tool runs from there via `pnpm --dir nodejs exec`. The tools
# themselves still cover the whole repo -- prettier and markdownlint reach
# up past nodejs/ by their own config globs.

[hooks.pre-commit]
enabled = true

[hooks.pre-commit.tools.eslint]
command = "pnpm"
args = ["--dir", "nodejs", "exec", "eslint", "--fix", "--cache", "--no-warn-ignored"]
type = "node"
group = "lint"
extensions = [".js", ".jsx", ".ts", ".tsx", ".vue", ".mjs", ".cjs"]
restage = true

[hooks.pre-commit.tools.prettier]
command = "pnpm"
args = ["--dir", "nodejs", "exec", "prettier", "--write", "--ignore-unknown", "--cache"]
type = "node"
group = "format"
extensions = [".js", ".jsx", ".ts", ".tsx", ".vue", ".mjs", ".cjs", ".json", ".md", ".yml", ".yaml", ".css", ".scss"]
restage = true

# [hooks.pre-commit.tools.typescript]
# command = "tsc"
# args = ["--noEmit", "--skipLibCheck"]
# type = "node"
# group = "lint"
# extensions = [".ts", ".tsx"]
# pass_files = false

[hooks.pre-commit.tools.markdownlint]
command = "pnpm"
args = ["--dir", "nodejs", "exec", "markdownlint-cli2"]
type = "node"
group = "lint"
extensions = [".md"]
