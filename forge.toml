# Migrated from .git-hooks.config.json
# Review and adjust as needed.
#
# No JS tooling here: the Node package and its prettier/eslint/markdownlint
# toolchain were deleted along with nodejs/ (ADR-0006). Rust and Dart each
# ship their own formatter, so the hooks call those directly and nothing
# needs node_modules to exist.
#
# pass_files = false: both formatters take a manifest/directory rather than
# the staged-path list the hook would otherwise pass.

[hooks.pre-commit]
enabled = true

[hooks.pre-commit.tools.rustfmt]
command = "cargo"
args = ["fmt", "--manifest-path", "rust-sender/Cargo.toml"]
type = "system"
group = "format"
extensions = [".rs"]
pass_files = false
restage = true

[hooks.pre-commit.tools.dartfmt]
command = "dart"
args = ["format", "flutter/lib", "flutter/test"]
type = "system"
group = "format"
extensions = [".dart"]
pass_files = false
restage = true
