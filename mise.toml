[tools]
node = "24.13.0"
pnpm = "10.32.1"

[tasks.hooks-install]
run = "forge install"

[tasks.node-install]
dir = "nodejs"
run = "pnpm install:local"

[tasks.node-lint]
dir = "nodejs"
run = "pnpm run lint && pnpm run lint:md && pnpm run format:check"

[tasks.node-build]
dir = "nodejs"
run = "pnpm run build"

[tasks.flutter-build]
dir = "flutter"
# `flutter build macos` has no architecture flag, and Flutter's prebuilt
# frameworks are universal, so a Release bundle carries an x86_64 half that
# never runs on Apple Silicon (44.7 MB -> 22 MB once stripped). ARCHS in
# Runner/Configs/AppInfo.xcconfig only covers targets Xcode compiles, hence
# the post-build strip.
run = """
flutter build macos --release
ARCHS=arm64 \
  BUILT_PRODUCTS_DIR="$PWD/build/macos/Build/Products/Release" \
  WRAPPER_NAME=PorterRx.app \
  sh macos/strip_x86_64.sh
"""

[tasks.flutter-test]
dir = "flutter"
run = "flutter analyze && flutter test"

[tasks.flutter-install]
dir = "flutter"
depends = ["flutter-build"]
run = """
rm -rf /Applications/PorterRx.app
cp -R build/macos/Build/Products/Release/PorterRx.app /Applications/
"""

[tasks.rust-build]
dir = "rust-sender"
run = "cargo build --release"

[tasks.rust-install]
dir = "rust-sender"
depends = ["rust-build"]
run = "cp target/release/porter-sender ~/.local/bin/porter-sender"

[tasks.rust-test]
dir = "rust-sender"
run = "cargo test"

[tasks.rust-check]
dir = "rust-sender"
run = "cargo clippy --all-targets -- -D warnings && cargo fmt --check"

[tasks.rust-send]
dir = "rust-sender"
depends = ["rust-build"]
run = "cargo run --release --"

[tasks.rust-serve]
dir = "rust-sender"
depends = ["rust-build"]
run = "cargo run --release -- serve"
